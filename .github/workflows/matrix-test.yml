name: OS matrix test

on:
  push:
    branches: [main]

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Show runner and tool versions
        shell: bash
        run: |
          echo "Runner OS: ${{ runner.os }}"
          python --version
          node --version
          uname -a
